# Automatización con deploy de github

# // Generar key
# ssh-keygen -t rsa -b 4096 -C "jensen.it23@gmail.com"

# // Configuración publica
# ssh-copy-id -i ~/.ssh/id_rsa root@37.27.158.199

# // Obtener key publica
# cat ~/.ssh/id_rsa.pub

# // Obtener key privada
# cat ~/.ssh/id_rsa

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend
      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend
      - name: Revisar sintaxis del backend
        run: node --check src/index.js
        working-directory: backend
      - name: Revisar sintaxis del frontend
        run: node --check server.js
        working-directory: frontend
      - name: Compilar frontend
        run: npm run build
        working-directory: frontend

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Comprobar secrets
        id: gate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy omitido. Faltan los secrets SSH_HOST, SSH_USER o SSH_KEY."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Secrets de SSH presentes. Sigue el deploy."
          fi

      - name: Preparar Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar frontend
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
        run: |
          echo "Instalando dependencias del frontend..."
          npm ci
          echo "Compilando frontend..."
          npm run build
          echo "Frontend compilado."

      - name: Preparar SSH
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "Guardando la clave SSH..."
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "Instalando rsync..."
          sudo apt-get update
          sudo apt-get install -y rsync
          echo "SSH listo."

      - name: Crear directorios en el servidor
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Creando /var/www/prueba en el servidor..."
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "mkdir -p /var/www/prueba/backend /var/www/prueba/frontend /var/www/prueba/deploy"
          echo "Directorios listos."

      - name: Subir proyecto
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Subiendo backend..."
          rsync -az --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude .git \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./backend/ "${SSH_USER}@${SSH_HOST}:/var/www/prueba/backend/"
          echo "Subiendo frontend..."
          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./frontend/ "${SSH_USER}@${SSH_HOST}:/var/www/prueba/frontend/"
          echo "Subiendo scripts de deploy..."
          rsync -az \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./deploy/ "${SSH_USER}@${SSH_HOST}:/var/www/prueba/deploy/"
          echo "Archivos subidos."

      - name: Escribir .env en el servidor
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Escribiendo /var/www/prueba/backend/.env ..."
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" << 'EOF'
          mkdir -p /var/www/prueba/backend
          echo "APP_MODE=${{ vars.APP_MODE }}" > /var/www/prueba/backend/.env
          echo "NODE_ENV=${{ vars.NODE_ENV }}" >> /var/www/prueba/backend/.env
          echo "PORT=${{ vars.PORT }}" >> /var/www/prueba/backend/.env
          echo "PGHOST=${{ vars.PGHOST }}" >> /var/www/prueba/backend/.env
          echo "PGPORT=${{ vars.PGPORT }}" >> /var/www/prueba/backend/.env
          echo "PGUSER=${{ vars.PGUSER }}" >> /var/www/prueba/backend/.env
          echo "PGPASSWORD=${{ secrets.PGPASSWORD }}" >> /var/www/prueba/backend/.env
          echo "PGDATABASE=${{ vars.PGDATABASE }}" >> /var/www/prueba/backend/.env
          echo "CORS_ORIGIN=${{ vars.CORS_ORIGIN }}" >> /var/www/prueba/backend/.env
          chmod 600 /var/www/prueba/backend/.env
          EOF
          echo ".env escrito."

      - name: Instalar, compilar y reiniciar
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Ejecutando update.sh en el servidor..."
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "bash /var/www/prueba/deploy/update.sh"
          echo "Servidor actualizado."


