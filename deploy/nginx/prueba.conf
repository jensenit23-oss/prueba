server {
    listen 80;
    server_name prueba.chat-live-support.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name prueba.chat-live-support.com;

    ssl_certificate /etc/letsencrypt/live/prueba.chat-live-support.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prueba.chat-live-support.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/prueba/frontend/dist;
    index index.html;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
